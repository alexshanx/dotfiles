name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck zsh

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -e
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz

      - name: Gitleaks (full history)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

      - name: Validate Renovate configuration
        run: python3 -m json.tool renovate.json >/dev/null

      - name: ShellCheck install.sh
        run: shellcheck install.sh

      - name: ShellCheck Git protection hooks
        run: shellcheck .githooks/pre-commit .githooks/pre-push

      - name: ShellCheck chezmoi scripts
        run: |
          set -e
          for f in home/.chezmoiscripts/*.tmpl; do
            body="$(sed '/^[[:space:]]*{{/d' "$f")"
            shell="sh"
            if printf '%s\n' "$body" | head -n1 | grep -q "#!/bin/bash"; then
              shell="bash"
            fi
            printf '%s\n' "$body" | shellcheck -s "$shell" -
          done

      - name: zsh syntax check
        run: zsh -n home/dot_zshrc

  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Seed prompt data (CI answers for .chezmoi.toml.tmpl)
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf '[data]\n  email = "ci@example.com"\n  is_work = false\n' > "$HOME/.config/chezmoi/chezmoi.toml"

      - name: chezmoi apply and verify
        run: |
          "$HOME/.local/bin/chezmoi" init --apply --source "$GITHUB_WORKSPACE"
          "$HOME/.local/bin/chezmoi" verify --source "$GITHUB_WORKSPACE"
